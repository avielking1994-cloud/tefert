<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>לוח מודעות - תפארת עובדיה</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;800&display=swap');
        * { box-sizing: border-box; }

        body {
            font-family: 'Assistant', sans-serif;
            background: #050a0f;
            background-image: radial-gradient(circle at center, #102030 0%, #050a0f 100%);
            color: white; 
            margin: 0; 
            padding: 4vh 4vw; /* מרווח ביטחון מהקצוות של הטלוויזיה */
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden;
        }

        header {
            background: linear-gradient(145deg, #1e3c72, #2a5298);
            padding: 0 30px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 4px solid #d4af37; 
            border-radius: 15px 15px 0 0; 
            height: 12vh; /* הוקטן מעט כדי למנוע חיתוך למטה */
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .header-right h1 { margin: 0; font-size: 2.5rem; color: #d4af37; text-shadow: 2px 2px 8px rgba(0,0,0,0.5); }
        #clock { font-size: 3.5rem; font-weight: 800; color: #fff; }

        main { 
            flex-grow: 1; 
            display: flex; 
            gap: 25px; 
            padding: 20px 0; 
            height: 78vh; /* מותאם למנוע חיתוך */
            min-height: 0;
        }

        #sidebar { 
            width: 30%; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            height: 100%;
        }

        .section-box { 
            background: rgba(255, 255, 255, 0.03); 
            border: 2px solid rgba(212, 175, 55, 0.4); 
            border-radius: 15px; 
            padding: 12px;
            display: flex;
            flex-direction: column;
        }

        #community-section { 
            flex-grow: 1; 
            overflow: hidden; 
        }

        .sidebar-title { 
            font-size: 1.6rem; 
            color: #d4af37; 
            text-align: center; 
            margin-bottom: 10px; 
            border-bottom: 2px solid #d4af37; 
            font-weight: 800;
            padding-bottom: 5px;
        }

        #prayers-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            justify-content: flex-start;
        }

        .prayer-item { 
            font-size: 1.4rem; 
            padding: 8px; 
            background: rgba(255, 255, 255, 0.07); 
            border-radius: 8px; 
            text-align: center; 
            border-right: 5px solid #d4af37; 
            font-weight: 600;
            white-space: nowrap;
        }

        .zman-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 8px; 
        }

        .zman-item { 
            background: rgba(0,0,0,0.4); 
            padding: 8px; 
            border-radius: 8px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            border: 1px solid rgba(212, 175, 55, 0.2); 
        }

        .zman-label { color: #d4af37; font-size: 0.8rem; font-weight: 600; }
        .zman-value { font-weight: 800; font-size: 1.2rem; color: #fff; }

        #message-card {
            flex-grow: 1; 
            background: #fff; 
            color: #050a0f; 
            border-radius: 20px;
            display: flex; 
            flex-direction: column; 
            padding: 40px; 
            text-align: center;
            border: 6px solid #d4af37; 
            justify-content: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            height: 100%;
        }

        #msg-header { 
            font-size: 2.8rem; 
            color: #1e3c72; 
            margin-bottom: 15px; 
            font-weight: 800; 
            border-bottom: 3px solid #d4af37; 
            display: inline-block; 
            padding-bottom: 5px; 
        }

        #msg-body { font-weight: 600; line-height: 1.3; transition: opacity 0.5s; }

        footer { 
            height: 5vh; 
            text-align: center; 
            color: rgba(212, 175, 55, 0.7); 
            font-size: 1rem; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: 600; 
        }
    </style>
</head>
<body>

    <header>
        <div class="header-right">
            <h1>ישיבת תפארת עובדיה</h1>
            <div id="date-display">טוען...</div>
        </div>
        <div id="clock">00:00</div>
    </header>

    <main>
        <div id="sidebar">
            <div id="community-section" class="section-box">
                <div class="sidebar-title">זמני הישיבה</div>
                <div id="prayers-list"></div>
            </div>
            <div id="zmanim-section" class="section-box">
                <div class="sidebar-title" style="font-size: 1.1rem;">זמני היום - בני ברק</div>
                <div id="zmanim-list" class="zman-grid"></div>
            </div>
        </div>
        <div id="message-card">
            <div><span id="msg-header"></span></div>
            <div id="msg-body">טוען הודעות...</div>
        </div>
    </main>

    <footer>לעילוי נשמת עליזה בת אריאלה ע"ה</footer>

    <script>
        function updateDateTime() { 
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'}); 
            document.getElementById('date-display').textContent = now.toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long' });
        }
        setInterval(updateDateTime, 1000); updateDateTime();

        async function loadZmanim() {
            try {
                const response = await fetch('https://www.hebcal.com/zmanim?cfg=json&city=IL-Bnei+Brak');
                const data = await response.json();
                const t = data.times;
                document.getElementById('zmanim-list').innerHTML = `
                    <div class="zman-item"><span class="zman-label">נץ</span><span class="zman-value">${formatT(t.sunrise)}</span></div>
                    <div class="zman-item"><span class="zman-label">חצות</span><span class="zman-value">${formatT(t.chatzot)}</span></div>
                    <div class="zman-item"><span class="zman-label">שקיעה</span><span class="zman-value">${formatT(t.sunset)}</span></div>
                `;
            } catch (e) { }
        }
        function formatT(iso) { return new Date(iso).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }); }

        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQsUHNKYdGwmym273eeGxigpITLd1ugZ-_095S6-QOcfvESZJQHmAZ-QTbZ55nNxtbXFsT2vMFglehg/pub?gid=0&single=true&output=csv';
        let newsItems = [];
        let currentIndex = 0;

        function parseCSV(text) {
            let lines = text.split(/\r?\n/);
            return lines.map(line => {
                let result = [];
                let current = "";
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    let char = line[i];
                    if (char === '"' && line[i+1] === '"') { current += '"'; i++; }
                    else if (char === '"') { inQuotes = !inQuotes; }
                    else if (char === ',' && !inQuotes) { result.push(current); current = ""; }
                    else { current += char; }
                }
                result.push(current);
                return result;
            });
        }

        async function loadSheets() {
            try {
                const response = await fetch(csvUrl + '&cache=' + new Date().getTime());
                const data = await response.text();
                const rows = parseCSV(data);
                
                let prayersHtml = "";
                let tempNews = [];

                rows.forEach((row, index) => {
                    if (index === 0 || row.length < 1) return;
                    let colA = (row[0] || "").trim();
                    let colB = (row[1] || "").trim();
                    
                    if (colA.includes("שחרית") || colA.includes("מנחה") || colA.includes("ערבית")) {
                        prayersHtml += `<div class="prayer-item">${colA} ${colB}</div>`;
                    } else if (colA || colB) {
                        tempNews.push({ title: colA, body: colB });
                    }
                });

                document.getElementById('prayers-list').innerHTML = prayersHtml;
                newsItems = tempNews;
                if (newsItems.length > 0 && currentIndex === 0) showNext();
            } catch (e) { }
        }

        function showNext() {
            if (newsItems.length === 0) return;
            const h = document.getElementById('msg-header');
            const b = document.getElementById('msg-body');
            b.style.opacity = 0;
            setTimeout(() => {
                const item = newsItems[currentIndex];
                h.textContent = item.title;
                b.textContent = item.body;
                let len = item.body.length;
                b.style.fontSize = len < 30 ? "5rem" : len < 100 ? "3.2rem" : "1.8rem";
                b.style.opacity = 1;
                currentIndex = (currentIndex + 1) % newsItems.length;
            }, 500);
        }

        loadZmanim(); loadSheets();
        setInterval(loadZmanim, 3600000);
        setInterval(loadSheets, 60000);
        setInterval(showNext, 12000);
    </script>
</body>
</html>
