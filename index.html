<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>לוח מודעות - תפארת עובדיה</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0c0c0c;
            color: white;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background: linear-gradient(90deg, #16222a, #3a6073);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #d4af37;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
        }

        .header-right h1 {
            margin: 0;
            font-size: 3rem;
            color: #d4af37;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }

        #clock {
            font-size: 4rem;
            font-weight: bold;
            color: #ffffff;
        }

        main {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #1b2735 0%, #090a0f 100%);
            padding: 20px;
        }

        #message-card {
            width: 85%;
            height: 60%;
            background: rgba(255, 255, 255, 0.98);
            color: #000;
            border-radius: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
            text-align: center;
            border: 5px solid #d4af37;
            padding: 30px;
            box-sizing: border-box;
            overflow: hidden; /* מבטיח שכלום לא יוצא מהמסגרת */
        }

        #message-text {
            font-size: 4.5rem; /* גודל מעט קטן יותר כדי שיתאים למסגרת */
            font-weight: bold;
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-width: 100%;
            animation: fadeIn 1.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        footer {
            background: #000;
            padding: 15px;
            text-align: center;
            font-size: 1.8rem;
            color: #d4af37;
            border-top: 2px solid #222;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-right">
            <h1>ישיבת תפארת עובדיה</h1>
            <div id="hebrew-date" style="font-size: 1.5rem; color: #fff; margin-top: 5px;">טוען תאריך...</div>
        </div>
        <div class="header-left">
            <div id="clock">00:00:00</div>
        </div>
    </header>

    <main>
        <div id="message-card">
            <p id="message-text">טוען מודעות...</p>
        </div>
    </main>

    <footer>
        "קבעת עיתים לתורה?" | לוח מודעות דיגיטלי
    </footer>

    <script>
        function updateClock() {
            document.getElementById('clock').textContent = new Date().toLocaleTimeString('he-IL');
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function fetchHebrewDate() {
            try {
                const res = await fetch('https://www.hebcal.com/etc/hdate-he.json');
                const data = await res.json();
                document.getElementById('hebrew-date').textContent = data.hebrew;
            } catch (e) { console.error("Date error"); }
        }
        fetchHebrewDate();

        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQsUHNKYdGwmym273eeGxigpITLd1ugZ-_095S6-QOcfvESZJQHmAZ-QTbZ55nNxtbXFsT2vMFglehg/pub?gid=0&single=true&output=csv'; 
        
        let messages = [];
        let index = 0;

        async function loadSheets() {
            try {
                const response = await fetch(csvUrl + '&cache_buster=' + new Date().getTime());
                const data = await response.text();
                
                // התיקון כאן:
                const lines = data.split('\n');
                
                // 1. מדלג על השורה הראשונה (הכותרות)
                // 2. לוקח רק את העמודה שבה נמצא הטקסט (נניח עמודה ראשונה או שנייה)
                messages = lines.slice(1) // מדלג על שורה 1
                                .map(line => {
                                    const columns = line.split(',');
                                    // כאן אנחנו בוחרים את העמודה. אם ההודעה היא בעמודה השנייה, נכתוב columns[1]
                                    // כרגע אני לוקח את העמודה שבה יש הכי הרבה טקסט כדי לא לטעות
                                    return columns.reduce((a, b) => a.length > b.length ? a : b, "")
                                                  .replace(/"/g, '')
                                                  .trim();
                                })
                                .filter(m => m.length > 2); // מתעלם משורות ריקות או קצרות מדי

                if (messages.length > 0 && index === 0) {
                    showNextMessage();
                }
            } catch (e) { 
                console.error("Sheet error", e);
            }
        }

        function showNextMessage() {
            if (messages.length > 0) {
                const msgElement = document.getElementById('message-text');
                
                // התאמת גודל פונט לפי אורך ההודעה (כדי שלא יצא מהמסגרת)
                const currentMsg = messages[index];
                if (currentMsg.length > 50) {
                    msgElement.style.fontSize = "3rem";
                } else if (currentMsg.length > 20) {
                    msgElement.style.fontSize = "4rem";
                } else {
                    msgElement.style.fontSize = "5.5rem";
                }

                msgElement.textContent = currentMsg;
                index = (index + 1) % messages.length;
            }
        }

        loadSheets();
        setInterval(loadSheets, 60000);
        setInterval(showNextMessage, 7000); // 7 שניות לכל הודעה שיהיה זמן לקרוא
    </script>
</body>
</html>
