<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>לוח מודעות - תפארת עובדיה</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0c0c0c;
            color: white;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background: linear-gradient(90deg, #16222a, #3a6073);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #d4af37;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
        }

        .header-right h1 {
            margin: 0;
            font-size: 2.5rem;
            color: #d4af37;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }

        #clock {
            font-size: 3rem;
            font-weight: bold;
        }

        main {
            flex-grow: 1;
            display: flex;
            gap: 25px;
            padding: 25px;
            background: radial-gradient(circle, #1b2735 0%, #090a0f 100%);
            box-sizing: border-box;
        }

        /* מלבן זמני תפילה (ימין) */
        #prayers-sidebar {
            width: 30%;
            background: rgba(255, 255, 255, 0.07);
            border: 2px solid #d4af37;
            border-radius: 20px;
            padding: 25px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .sidebar-title {
            font-size: 2.2rem;
            color: #d4af37;
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #d4af37;
            padding-bottom: 10px;
            font-weight: bold;
        }

        #prayers-list {
            font-size: 1.9rem;
            line-height: 1.6;
            white-space: pre-wrap;
            color: #ffffff;
        }

        /* מלבן מודעות מתחלפות (שמאל) */
        #message-card {
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.98);
            color: #000;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border: 4px solid #d4af37;
            padding: 40px;
            text-align: center;
        }

        #msg-title {
            font-size: 2.5rem;
            color: #3a6073;
            margin-bottom: 20px;
            text-decoration: underline;
        }

        #msg-body {
            font-weight: bold;
            margin: 0;
            transition: opacity 0.6s ease-in-out;
        }

        footer {
            background: #000;
            padding: 10px;
            text-align: center;
            font-size: 1.4rem;
            color: #d4af37;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-right">
            <h1>ישיבת תפארת עובדיה</h1>
            <div id="hebrew-date" style="font-size: 1.3rem; color: #fff;">טוען תאריך...</div>
        </div>
        <div id="clock">00:00:00</div>
    </header>

    <main>
        <div id="prayers-sidebar">
            <div class="sidebar-title">זמני תפילה</div>
            <div id="prayers-list">טוען זמנים...</div>
        </div>

        <div id="message-card">
            <div id="msg-title"></div>
            <p id="msg-body">טוען מודעות...</p>
        </div>
    </main>

    <footer>
        "והגית בו יומם ולילה" | לעילוי נשמת כל נפטרי עמו ישראל
    </footer>

    <script>
        function updateClock() { document.getElementById('clock').textContent = new Date().toLocaleTimeString('he-IL'); }
        setInterval(updateClock, 1000); updateClock();

        async function fetchHebrewDate() {
            try {
                const res = await fetch('https://www.hebcal.com/etc/hdate-he.json');
                const data = await res.json();
                document.getElementById('hebrew-date').textContent = data.hebrew;
            } catch (e) {}
        }
        fetchHebrewDate();

        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQsUHNKYdGwmym273eeGxigpITLd1ugZ-_095S6-QOcfvESZJQHmAZ-QTbZ55nNxtbXFsT2vMFglehg/pub?gid=0&single=true&output=csv';
        
        let newsItems = [];
        let currentIndex = 0;

        async function loadSheets() {
            try {
                const response = await fetch(csvUrl + '&cache=' + new Date().getTime());
                const data = await response.text();
                const rows = data.split('\n').map(row => row.split(',').map(cell => cell.replace(/"/g, '').trim()));
                
                const news = [];
                let prayerText = "לא הוגדרו זמנים";

                // עוברים על השורות (מדלגים על הראשונה של הכותרות)
                for (let i = 1; i < rows.length; i++) {
                    const [title, text, order] = rows[i];
                    if (!title) continue;

                    if (title.includes("זמני תפילה")) {
                        prayerText = text;
                    } else {
                        news.push({ title, text });
                    }
                }

                document.getElementById('prayers-list').textContent = prayerText;
                newsItems = news;

                if (newsItems.length > 0 && currentIndex === 0) showNext();
            } catch (e) {}
        }

        function showNext() {
            if (newsItems.length > 0) {
                const titleEl = document.getElementById('msg-title');
                const bodyEl = document.getElementById('msg-body');
                
                bodyEl.style.opacity = 0;
                setTimeout(() => {
                    const item = newsItems[currentIndex];
                    titleEl.textContent = item.title;
                    bodyEl.textContent = item.text;
                    
                    // התאמת גודל טקסט
                    bodyEl.style.fontSize = item.text.length > 50 ? "3rem" : "5rem";
                    
                    bodyEl.style.opacity = 1;
                    currentIndex = (currentIndex + 1) % newsItems.length;
                }, 600);
            }
        }

        loadSheets();
        setInterval(loadSheets, 60000);
        setInterval(showNext, 10000); // 10 שניות לכל מודעה
    </script>
</body>
</html>
