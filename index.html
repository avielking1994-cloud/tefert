<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>לוח מודעות - תפארת עובדיה</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&display=swap');

        * { box-sizing: border-box; }

        body {
            font-family: 'Assistant', sans-serif;
            background: #0c0c0c;
            color: white;
            margin: 0;
            padding: 15px; 
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden; /* מבטל גלילה */
        }

        header {
            background: linear-gradient(90deg, #16222a, #3a6073);
            padding: 10px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #d4af37;
            border-radius: 12px 12px 0 0;
            height: 12%;
        }

        .header-right h1 { margin: 0; font-size: 2.2rem; color: #d4af37; }
        #date-display { font-size: 1.2rem; color: #ddd; }
        #clock { font-size: 3rem; font-weight: bold; }

        main {
            flex-grow: 1;
            display: flex;
            gap: 15px;
            padding: 15px 0;
            height: 80%;
            min-height: 0;
        }

        #sidebar {
            width: 30%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
        }

        .section-box {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 10px;
            overflow: hidden;
        }

        #community-section { flex-grow: 2; } /* זמני ישיבה מקבלים יותר מקום */
        #zmanim-section { flex-grow: 1; background: rgba(212, 175, 55, 0.05); }

        .sidebar-title {
            font-size: 1.5rem;
            color: #d4af37;
            text-align: center;
            margin-bottom: 8px;
            border-bottom: 1px solid #d4af37;
            padding-bottom: 5px;
            font-weight: bold;
        }

        .prayer-item {
            font-size: 1.3rem;
            margin-bottom: 6px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            text-align: center;
        }

        .zman-item {
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
            padding: 4px 8px;
            border-bottom: 1px solid rgba(212,175,55,0.2);
        }

        #message-card {
            flex-grow: 1;
            background: #ffffff;
            color: #1a1a1a;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            border: 4px solid #d4af37;
            height: 100%;
        }

        #msg-header {
            font-size: 2.2rem;
            color: #3a6073;
            margin-bottom: 15px;
            font-weight: 700;
            border-bottom: 2px solid #d4af37;
        }

        #msg-body { 
            font-weight: 600; 
            width: 100%;
            line-height: 1.2;
            transition: opacity 0.5s ease;
        }

        footer { 
            height: 5%;
            text-align: center; 
            color: #aaa; 
            font-size: 1rem;
            padding-top: 5px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-right">
            <h1>ישיבת תפארת עובדיה</h1>
            <div id="date-display">טוען תאריך...</div>
        </div>
        <div id="clock">00:00:00</div>
    </header>

    <main>
        <div id="sidebar">
            <div id="community-section" class="section-box">
                <div class="sidebar-title">זמני הישיבה</div>
                <div id="prayers-list"></div>
            </div>
            
            <div id="zmanim-section" class="section-box">
                <div class="sidebar-title" style="font-size: 1.2rem;">זמני היום - בני ברק</div>
                <div id="zmanim-list"></div>
            </div>
        </div>

        <div id="message-card">
            <div id="msg-header"></div>
            <p id="msg-body">טוען הודעות...</p>
        </div>
    </main>

    <footer>הלוח נתרם לעילוי נשמת עליזה בת אריאלה | אביאל חכמון</footer>

    <script>
        function updateDateTime() { 
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit', second:'2-digit'}); 
            document.getElementById('date-display').textContent = now.toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long' });
        }
        setInterval(updateDateTime, 1000); 
        updateDateTime();

        async function loadZmanim() {
            try {
                const response = await fetch('https://www.hebcal.com/zmanim?cfg=json&city=IL-Bnei+Brak&sedrot=1');
                const data = await response.json();
                const t = data.times;
                
                let html = `
                    <div class="zman-item"><span>נץ החמה:</span> <strong>${formatT(t.sunrise)}</strong></div>
                    <div class="zman-item"><span>סוזק"ש גר"א:</span> <strong>${formatT(t.sozksGra)}</strong></div>
                    <div class="zman-item"><span>חצות:</span> <strong>${formatT(t.chatzot)}</strong></div>
                    <div class="zman-item"><span>שקיעה:</span> <strong>${formatT(t.sunset)}</strong></div>
                `;
                document.getElementById('zmanim-list').innerHTML = html;
            } catch (e) { console.log("Zmanim Error"); }
        }

        function formatT(iso) { return new Date(iso).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }); }

        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQsUHNKYdGwmym273eeGxigpITLd1ugZ-_095S6-QOcfvESZJQHmAZ-QTbZ55nNxtbXFsT2vMFglehg/pub?gid=0&single=true&output=csv';
        let newsItems = [];
        let currentIndex = 0;

        async function loadSheets() {
            try {
                const response = await fetch(csvUrl + '&cache=' + new Date().getTime());
                const data = await response.text();
                const lines = data.split('\n').filter(l => l.trim().length > 2);
                
                let prayersHtml = "";
                let tempNews = [];

                lines.forEach((line, index) => {
                    if (index === 0) return;
                    let cleanLine = line.replace(/"/g, '').trim();
                    if (cleanLine.includes("שחרית") || cleanLine.includes("מנחה") || cleanLine.includes("ערבית")) {
                        prayersHtml += `<div class="prayer-item">${cleanLine}</div>`;
                    } else {
                        let parts = cleanLine.split(',');
                        if (parts[0] || parts[1]) tempNews.push({ title: parts[0] || "", body: parts.slice(1).join(' ') || "" });
                    }
                });

                document.getElementById('prayers-list').innerHTML = prayersHtml;
                newsItems = tempNews;
                if (newsItems.length > 0 && currentIndex === 0) showNext();
            } catch (e) { }
        }

        function showNext() {
            if (newsItems.length === 0) return;
            const h = document.getElementById('msg-header');
            const b = document.getElementById('msg-body');
            b.style.opacity = 0;
            setTimeout(() => {
                const item = newsItems[currentIndex];
                h.textContent = item.title;
                b.textContent = item.body;
                let len = item.body.length;
                b.style.fontSize = len < 30 ? "4.5rem" : len < 80 ? "3rem" : "1.8rem";
                b.style.opacity = 1;
                currentIndex = (currentIndex + 1) % newsItems.length;
            }, 500);
        }

        loadZmanim(); loadSheets();
        setInterval(loadZmanim, 3600000);
        setInterval(loadSheets, 60000);
        setInterval(showNext, 10000);
    </script>
</body>
</html>
