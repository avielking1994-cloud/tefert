<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ישיבת תפארת עובדיה - לוח מודעות</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&family=Frank+Ruhl+Libre:wght@700&display=swap');

    body {
        margin: 0; padding: 0;
        background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
        color: white; direction: rtl;
        font-family: 'Assistant', sans-serif;
        overflow: hidden;
        border: 15px solid #d4af37;
        box-sizing: border-box;
        height: 100vh;
    }

    /* כותרת הישיבה */
    #mainHeader {
        text-align: center;
        padding: 30px 0;
        border-bottom: 2px solid #d4af37;
        background: rgba(0, 0, 0, 0.6);
    }

    #mainHeader h2 {
        margin: 0;
        font-family: 'Frank Ruhl Libre', serif;
        font-size: 70px;
        color: #ffd700;
        text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
    }

    /* שעון ותאריך בפינה העליונה */
    #topCornerInfo {
        position: absolute;
        top: 35px;
        left: 40px;
        text-align: left;
        z-index: 1001;
    }

    #clock { 
        font-size: 65px; 
        font-weight: bold; 
        color: #fff; 
        line-height: 1;
        font-family: monospace;
    }

    #englishDate { 
        font-size: 24px; 
        color: #ffd700; 
        margin-top: 5px;
        font-weight: bold;
    }

    /* אזור המודעות המרכזי */
    #slidesContainer {
        display: flex;
        justify-content: center;
        align-items: center;
        height: calc(100vh - 200px);
        padding: 0 100px;
        text-align: center;
    }

    .slide {
        display: none;
        animation: fadeIn 1.2s ease-in-out forwards;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.98); }
        to { opacity: 1; transform: scale(1); }
    }

    .slide h1 { 
        font-size: 100px; 
        color: #fff; 
        margin-bottom: 30px; 
        font-family: 'Frank Ruhl Libre', serif;
        border-bottom: 3px solid #d4af37;
        display: inline-block;
        padding-bottom: 10px;
    }
    .slide p { 
        font-size: 60px; 
        color: #e0e0e0; 
        line-height: 1.4;
        max-width: 900px;
        margin: 0 auto;
    }
</style>
</head>
<body>

<div id="topCornerInfo">
    <div id="clock">00:00:00</div>
    <div id="englishDate">00/00/0000</div>
</div>

<div id="mainHeader">
    <h2>ישיבת תפארת עובדיה</h2>
</div>

<div id="slidesContainer">
    <div class="slide" style="display:block;">
        <h1>ברוכים הבאים</h1>
        <p>טוען את לוח המודעות...</p>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

<script>
    // 1. עדכון שעון ותאריך לועזי
    function updateTime() {
        const now = new Date();
        // שעון
        document.getElementById('clock').innerText = now.toLocaleTimeString('he-IL', {hour12: false});
        // תאריך לועזי
        const options = { day: '2-digit', month: '2-digit', year: 'numeric' };
        document.getElementById('englishDate').innerText = now.toLocaleDateString('he-IL', options);
    }
    setInterval(updateTime, 1000);
    updateTime();

    // 2. חיבור לאקסל
    const raw_url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQsUHNKYdGwmym273eeGxigpITLd1ugZ-_095S6-QOcfvESZJQHmAZ-QTbZ55nNxtbXFsT2vMFglehg/pub?gid=0&single=true&output=csv";
    const CSV_URL = "https://api.allorigins.win/raw?url=" + encodeURIComponent(raw_url);

    function loadExcel() {
        Papa.parse(CSV_URL, {
            download: true,
            complete: function(results) {
                const data = results.data.slice(1).filter(r => r[0] || r[1]);
                const container = document.getElementById("slidesContainer");
                if (data.length === 0) return;
                
                container.innerHTML = "";
                data.forEach(row => {
                    const div = document.createElement("div");
                    div.className = "slide";
                    div.innerHTML = `<h1>${row[0] || ""}</h1><p>${row[1] || ""}</p>`;
                    container.appendChild(div);
                });
                startLoop();
            }
        });
    }

    let idx = 0;
    function startLoop() {
        const slides = document.querySelectorAll(".slide");
        if (slides.length === 0) return;
        function next() {
            slides.forEach(s => s.style.display = "none");
            slides[idx % slides.length].style.display = "block";
            idx++;
        }
        next();
        setInterval(next, 10000); // מעבר כל 10 שניות
    }
    loadExcel();
    // רענון נתונים מהאקסל כל 5 דקות באופן אוטומטי
    setInterval(loadExcel, 300000);
</script>
</body>
</html>
