<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>לוח מודעות - תפארת עובדיה</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;800&display=swap');

        * { box-sizing: border-box; }

        @keyframes pulse-glow {
            0% { text-shadow: 0 0 10px rgba(212, 175, 55, 0.3); }
            50% { text-shadow: 0 0 25px rgba(212, 175, 55, 0.7), 0 0 40px rgba(212, 175, 55, 0.4); }
            100% { text-shadow: 0 0 10px rgba(212, 175, 55, 0.3); }
        }

        body {
            font-family: 'Assistant', sans-serif;
            background-color: #050a0f;
            background-image: radial-gradient(circle at center, #102030 0%, #050a0f 100%);
            color: white;
            margin: 0;
            padding: 2vh; 
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background: linear-gradient(145deg, #1e3c72, #2a5298);
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 5px solid #d4af37;
            border-radius: 20px 20px 0 0;
            height: 15vh;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .header-right h1 { 
            margin: 0; 
            font-size: 3rem; 
            color: #d4af37; 
            animation: pulse-glow 3s infinite ease-in-out;
        }

        #date-display { font-size: 1.5rem; color: #e0e0e0; }
        
        #clock { 
            font-size: 4.8rem; 
            font-weight: 800; 
            color: #fff; 
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        main {
            flex-grow: 1;
            display: flex;
            gap: 20px;
            padding: 20px 0;
            height: 75vh;
            min-height: 0;
        }

        #sidebar {
            width: 32%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .section-box {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(212, 175, 55, 0.5);
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        #community-section { flex-grow: 1; overflow: hidden; }
        #zmanim-section { background: rgba(212, 175, 55, 0.1); border-color: #d4af37; }

        .sidebar-title {
            font-size: 1.8rem;
            color: #d4af37;
            text-align: center;
            margin-bottom: 12px;
            border-bottom: 2px solid #d4af37;
            padding-bottom: 8px;
            font-weight: 800;
        }

        .prayer-item {
            font-size: 1.6rem;
            margin-bottom: 8px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            border-right: 5px solid #d4af37;
        }

        .zman-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .zman-item {
            background: rgba(0,0,0,0.4);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .zman-label { color: #d4af37; font-size: 1rem; margin-bottom: 3px; font-weight: 600; }
        .zman-value { font-weight: 800; font-size: 1.5rem; color: #fff; }

        #message-card {
            flex-grow: 1;
            background: #fff;
            color: #050a0f;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            padding: 50px;
            text-align: center;
            border: 6px solid #d4af37;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            justify-content: center;
        }

        #msg-header {
            font-size: 3.2rem;
            color: #1e3c72;
            margin-bottom: 25px;
            font-weight: 800;
            text-decoration: underline #d4af37 4px;
        }

        #msg-body { 
            font-weight: 600; 
            line-height: 1.4;
            transition: opacity 0.5s ease-in-out;
        }

        footer { 
            height: 5vh;
            text-align: center; 
            color: rgba(212, 175, 55, 0.8); 
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-right">
            <h1>ישיבת תפארת עובדיה</h1>
            <div id="date-display">טוען תאריך...</div>
        </div>
        <div id="clock">00:00</div>
    </header>

    <main>
        <div id="sidebar">
            <div id="community-section" class="section-box">
                <div class="sidebar-title">זמני הישיבה</div>
                <div id="prayers-list"></div>
            </div>
            
            <div id="zmanim-section" class="section-box">
                <div class="sidebar-title">זמני היום - בני ברק</div>
                <div id="zmanim-list" class="zman-grid"></div>
            </div>
        </div>

        <div id="message-card">
            <div id="msg-header"></div>
            <div id="msg-body">טוען הודעות...</div>
        </div>
    </main>

    <footer>נתרם לעילוי נשמת עליזה בת אריאלה ע"ה</footer>

    <script>
        function updateDateTime() { 
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'}); 
            document.getElementById('date-display').textContent = now.toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }
        setInterval(updateDateTime, 1000); updateDateTime();

        async function loadZmanim() {
            try {
                const response = await fetch('https://www.hebcal.com/zmanim?cfg=json&city=IL-Bnei+Brak');
                const data = await response.json();
                const t = data.times;
                
                document.getElementById('zmanim-list').innerHTML = `
                    <div class="zman-item"><span class="zman-label">נץ החמה</span><span class="zman-value">${formatT(t.sunrise)}</span></div>
                    <div class="zman-item"><span class="zman-label">חצות</span><span class="zman-value">${formatT(t.chatzot)}</span></div>
                    <div class="zman-item"><span class="zman-label">שקיעה</span><span class="zman-value">${formatT(t.sunset)}</span></div>
                `;
            } catch (e) { }
        }

        function formatT(iso) { return new Date(iso).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }); }

        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQsUHNKYdGwmym273eeGxigpITLd1ugZ-_095S6-QOcfvESZJQHmAZ-QTbZ55nNxtbXFsT2vMFglehg/pub?gid=0&single=true&output=csv';
        let newsItems = [];
        let currentIndex = 0;

        async function loadSheets() {
            try {
                const response = await fetch(csvUrl + '&cache=' + new Date().getTime());
                const data = await response.text();
                const lines = data.split('\n').filter(l => l.trim().length > 2);
                
                let prayersHtml = "";
                let tempNews = [];

                lines.forEach((line, index) => {
                    if (index === 0) return;
                    // ניקוי יסודי של פסיקים בתחילת השורה עבור שחרית/מנחה/ערבית
                    let cleanLine = line.replace(/^[,\s"']+|[,\s"']+$/g, '').trim();
                    
                    if (cleanLine.includes("שחרית") || cleanLine.includes("מנחה") || cleanLine.includes("ערבית")) {
                        prayersHtml += `<div class="prayer-item">${cleanLine}</div>`;
                    } else {
                        let parts = cleanLine.split(',');
                        let title = parts[0]?.trim() || "";
                        let body = parts.slice(1).join(' ').trim() || "";
                        if (title || body) tempNews.push({ title, body });
                    }
                });

                document.getElementById('prayers-list').innerHTML = prayersHtml;
                newsItems = tempNews;
                if (newsItems.length > 0 && currentIndex === 0) showNext();
            } catch (e) { }
        }

        function showNext() {
            if (newsItems.length === 0) return;
            const h = document.getElementById('msg-header');
            const b = document.getElementById('msg-body');
            b.style.opacity = 0;
            setTimeout(() => {
                const item = newsItems[currentIndex];
                h.textContent = item.title;
                b.textContent = item.body;
                let len = item.body.length;
                b.style.fontSize = len < 30 ? "5.5rem" : len < 100 ? "3.8rem" : "2.2rem";
                b.style.opacity = 1;
                currentIndex = (currentIndex + 1) % newsItems.length;
            }, 500);
        }

        loadZmanim(); loadSheets();
        setInterval(loadZmanim, 3600000);
        setInterval(loadSheets, 60000);
        setInterval(showNext, 12000);
    </script>
</body>
</html>
