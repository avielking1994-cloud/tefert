<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>לוח מודעות - תפארת עובדיה</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;800&display=swap');
        * { box-sizing: border-box; }

        body {
            font-family: 'Assistant', sans-serif;
            background: linear-gradient(rgba(0, 15, 35, 0.8), rgba(0, 15, 35, 0.8)), 
                        url('http://googleusercontent.com/image_collection/image_retrieval/1711381228697292235_0');
            background-size: cover;
            background-position: center;
            color: white; margin: 0; padding: 2vh 2vw; 
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
            border: 10px solid #d4af37;
        }

        header {
            background: rgba(16, 33, 61, 0.9);
            padding: 10px 30px; display: flex; justify-content: space-between; align-items: center;
            border: 2px solid #d4af37; border-radius: 15px; height: 14vh;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            margin-bottom: 10px;
        }

        .header-right { display: flex; flex-direction: column; justify-content: center; }
        .header-right h1 { margin: 0; font-size: 2.5rem; color: #d4af37; font-weight: 800; line-height: 1.1; }
        #date-display { font-size: 1.4rem; color: #ddd; margin-top: 5px; }
        
        #clock { font-size: 4.5rem; font-weight: 800; color: #fff; }

        main { flex-grow: 1; display: flex; gap: 15px; padding: 5px 0; height: 62vh; overflow: hidden; }

        .column { display: flex; flex-direction: column; gap: 10px; height: 100%; }
        #col-right { width: 23%; } 
        #col-center { width: 54%; } 
        #col-left { width: 23%; } 

        .section-box { 
            background: rgba(0, 0, 0, 0.7); 
            border: 1px solid #d4af37; 
            border-radius: 12px; padding: 12px;
            backdrop-filter: blur(8px);
            overflow: hidden;
        }

        .sidebar-title { 
            font-size: 1.4rem; color: #d4af37; text-align: center; 
            margin-bottom: 8px; border-bottom: 2px solid #d4af37; font-weight: 800; padding-bottom: 5px;
        }

        .prayer-item { 
            font-size: 1.3rem; padding: 8px; background: rgba(212, 175, 55, 0.15); 
            border-radius: 8px; text-align: center; border-right: 5px solid #d4af37; margin-bottom: 6px;
            font-weight: 600;
        }

        #zmanim-list { display: flex; flex-direction: column; gap: 4px; }
        .zman-item { display: flex; justify-content: space-between; padding: 6px 10px; border-bottom: 1px solid rgba(212,175,55,0.2); }
        .zman-label { color: #d4af37; font-weight: 600; font-size: 1.1rem; }
        .zman-value { font-weight: 800; font-size: 1.2rem; }

        #message-card {
            background: rgba(255, 255, 255, 0.96); color: #050a0f; border-radius: 25px;
            display: flex; flex-direction: column; padding: 30px; text-align: center;
            border: 8px solid #d4af37; justify-content: center; height: 100%;
        }
        #msg-header { font-size: 3rem; color: #1e3c72; margin-bottom: 15px; font-weight: 800; border-bottom: 3px solid #d4af37; display: inline-block; }
        #msg-body { font-weight: 800; line-height: 1.2; font-size: 3.5rem; }

        .patron-box {
            flex: 1; background: linear-gradient(135deg, rgba(212, 175, 55, 0.3), rgba(0,0,0,0.5));
            border: 2px solid #d4af37; border-radius: 15px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px;
        }
        .patron-title { color: #d4af37; font-size: 1.3rem; font-weight: 800; margin-bottom: 3px; }
        .patron-name { color: #fff; font-size: 1.6rem; font-weight: 600; text-align: center; }

        footer { 
            height: 10vh; text-align: center; color: #d4af37; 
            font-size: 2.2rem; display: flex; align-items: center; justify-content: center; 
            font-weight: 800; text-shadow: 2px 2px 8px black;
            border-top: 2px solid rgba(212,175,55,0.4);
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-right">
            <h1>ישיבת תפארת עובדיה</h1>
            <div id="date-display">טוען...</div>
        </div>
        <div id="clock">00:00</div>
    </header>

    <main>
        <div id="col-right" class="column">
            <div class="section-box" style="flex: 2;">
                <div class="sidebar-title">זמני הישיבה</div>
                <div id="prayers-list"></div>
            </div>
            <div class="section-box" style="flex: 1;">
                <div class="sidebar-title" style="font-size: 1.1rem;">זמני היום</div>
                <div id="zmanim-list"></div>
            </div>
        </div>

        <div id="col-center" class="column">
            <div id="message-card">
                <div><span id="msg-header"></span></div>
                <div id="msg-body">טוען...</div>
            </div>
        </div>

        <div id="col-left" class="column">
            <div class="patron-box">
                <div class="patron-title">פרנס היום</div>
                <div id="patron-day" class="patron-name">נדבת לב</div>
            </div>
            <div class="patron-box">
                <div class="patron-title">פרנס השבוע</div>
                <div id="patron-week" class="patron-name">נדבת לב</div>
            </div>
            <div class="patron-box">
                <div class="patron-title">פרנס החודש</div>
                <div id="patron-month" class="patron-name">נדבת לב</div>
            </div>
        </div>
    </main>

    <footer>נתרם לעילוי נשמת עליזה בת אריאלה ע"ה</footer>

    <script>
        function updateDateTime() { 
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'}); 
            document.getElementById('date-display').textContent = now.toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long' });
        }
        setInterval(updateDateTime, 1000); updateDateTime();

        async function loadZmanim() {
            try {
                const response = await fetch('https://www.hebcal.com/zmanim?cfg=json&city=IL-Bnei+Brak');
                const data = await response.json();
                const t = data.times;
                document.getElementById('zmanim-list').innerHTML = `
                    <div class="zman-item"><span class="zman-label">נץ</span><span class="zman-value">${formatT(t.sunrise)}</span></div>
                    <div class="zman-item"><span class="zman-label">חצות</span><span class="zman-value">${formatT(t.chatzot)}</span></div>
                    <div class="zman-item"><span class="zman-label">שקיעה</span><span class="zman-value">${formatT(t.sunset)}</span></div>
                `;
            } catch (e) { }
        }
        function formatT(iso) { return new Date(iso).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }); }

        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQsUHNKYdGwmym273eeGxigpITLd1ugZ-_095S6-QOcfvESZJQHmAZ-QTbZ55nNxtbXFsT2vMFglehg/pub?gid=0&single=true&output=csv';
        let newsItems = []; let currentIndex = 0;

        function parseCSV(text) {
            let lines = text.split(/\r?\n/);
            return lines.map(line => {
                let result = []; let current = ""; let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    let char = line[i];
                    if (char === '"' && line[i+1] === '"') { current += '"'; i++; }
                    else if (char === '"') { inQuotes = !inQuotes; }
                    else if (char === ',' && !inQuotes) { result.push(current); current = ""; }
                    else { current += char; }
                }
                result.push(current); return result;
            });
        }

        async function loadSheets() {
            try {
                const response = await fetch(csvUrl + '&cache=' + new Date().getTime());
                const data = await response.text();
                const rows = parseCSV(data);
                let prayersHtml = ""; let tempNews = [];
                let patrons = { day: "נדבת לב", week: "נדבת לב", month: "נדבת לב" };
                rows.forEach((row, index) => {
                    if (index === 0 || row.length < 1) return;
                    let colA = (row[0] || "").trim(); let colB = (row[1] || "").trim();
                    if (colA.includes("שחרית") || colA.includes("מנחה") || colA.includes("ערבית")) {
                        prayersHtml += `<div class="prayer-item">${colA} ${colB}</div>`;
                    } else if (colA.includes("פרנס היום")) { patrons.day = colB; }
                    else if (colA.includes("פרנס השבוע")) { patrons.week = colB; }
                    else if (colA.includes("פרנס החודש")) { patrons.month = colB; }
                    else if (colA || colB) { tempNews.push({ title: colA, body: colB }); }
                });
                document.getElementById('prayers-list').innerHTML = prayersHtml;
                document.getElementById('patron-day').textContent = patrons.day;
                document.getElementById('patron-week').textContent = patrons.week;
                document.getElementById('patron-month').textContent = patrons.month;
                newsItems = tempNews;
                if (newsItems.length > 0 && currentIndex === 0) showNext();
            } catch (e) { }
        }

        function showNext() {
            if (newsItems.length === 0) return;
            const h = document.getElementById('msg-header');
            const b = document.getElementById('msg-body');
            b.style.opacity = 0;
            setTimeout(() => {
                const item = newsItems[currentIndex];
                h.textContent = item.title; b.textContent = item.body;
                let len = item.body.length;
                b.style.fontSize = len < 30 ? "4rem" : len < 100 ? "2.8rem" : "1.8rem";
                b.style.opacity = 1;
                currentIndex = (currentIndex + 1) % newsItems.length;
            }, 500);
        }

        loadZmanim(); loadSheets();
        setInterval(loadZmanim, 3600000);
        setInterval(loadSheets, 60000);
        setInterval(showNext, 12000);
    </script>
</body>
</html>
