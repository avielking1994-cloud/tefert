<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>לוח מודעות - תפארת עובדיה</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0c0c0c;
            color: white;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background: linear-gradient(90deg, #16222a, #3a6073);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #d4af37;
        }

        .header-right h1 { margin: 0; font-size: 2.5rem; color: #d4af37; }
        #clock { font-size: 3rem; font-weight: bold; }

        main {
            flex-grow: 1;
            display: flex;
            gap: 20px;
            padding: 20px;
            background: radial-gradient(circle, #1b2735 0%, #090a0f 100%);
            box-sizing: border-box;
        }

        /* מלבן זמני תפילה (ימין) */
        #prayers-sidebar {
            width: 35%;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid #d4af37;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .sidebar-title {
            font-size: 2.2rem;
            color: #d4af37;
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #d4af37;
            padding-bottom: 10px;
        }

        .prayer-item {
            font-size: 2rem;
            margin-bottom: 20px;
            padding: 10px;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        /* מלבן מודעות מתחלפות (שמאל) */
        #message-card {
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.98);
            color: #000;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
            border: 4px solid #d4af37;
        }

        #msg-header {
            font-size: 2.5rem;
            color: #3a6073;
            margin-bottom: 20px;
            text-decoration: underline;
            font-weight: bold;
        }

        #msg-body { font-weight: bold; transition: opacity 0.5s ease; margin: 0; }

        footer { background: #000; padding: 10px; text-align: center; color: #d4af37; font-size: 1.2rem; }
    </style>
</head>
<body>

    <header>
        <div class="header-right">
            <h1>ישיבת תפארת עובדיה</h1>
            <div id="hebrew-date" style="font-size: 1.3rem; color: #fff;">טוען תאריך...</div>
        </div>
        <div id="clock">00:00:00</div>
    </header>

    <main>
        <div id="prayers-sidebar">
            <div class="sidebar-title">זמני תפילה</div>
            <div id="prayers-list"></div>
        </div>
        <div id="message-card">
            <div id="msg-header"></div>
            <p id="msg-body">טוען הודעות...</p>
        </div>
    </main>

    <footer>כל הזכויות שמורות לאביאל חכמון | הלוח נתרם לעילוי נשמת עליזה בת אריאלה </footer>

    <script>
        function updateClock() { document.getElementById('clock').textContent = new Date().toLocaleTimeString('he-IL'); }
        setInterval(updateClock, 1000); updateClock();

        async function fetchHebrewDate() {
            try {
                const res = await fetch('https://www.hebcal.com/etc/hdate-he.json');
                const data = await res.json();
                document.getElementById('hebrew-date').textContent = data.hebrew;
            } catch (e) {}
        }
        fetchHebrewDate();

        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQsUHNKYdGwmym273eeGxigpITLd1ugZ-_095S6-QOcfvESZJQHmAZ-QTbZ55nNxtbXFsT2vMFglehg/pub?gid=0&single=true&output=csv';
        
        let newsItems = [];
        let currentIndex = 0;

        async function loadSheets() {
            try {
                const response = await fetch(csvUrl + '&cache=' + new Date().getTime());
                const data = await response.text();
                
                const lines = data.split('\n').filter(l => l.trim().length > 2);
                
                let prayersHtml = "";
                let tempNews = [];

                lines.forEach((line, index) => {
                    if (index === 0) return; // דילוג על כותרת הטבלה

                    // ניקוי פסיקים מיותרים בהתחלה ובסוף וגרשיים
                    let cleanLine = line.replace(/^,+|,+$/g, '').replace(/"/g, '').trim();
                    
                    // זיהוי אם זו שורת תפילה
                    if (cleanLine.includes("שחרית") || cleanLine.includes("מנחה") || cleanLine.includes("ערבית")) {
                        // הסרת פסיקים פנימיים אם נשארו בתחילת המילה
                        let prayerText = cleanLine.replace(/^,/, '').trim();
                        prayersHtml += `<div class="prayer-item">${prayerText}</div>`;
                    } 
                    else if (!cleanLine.includes("TitleText") && !cleanLine.includes("זמני תפילה")) {
                        // הפרדה בין כותרת לתוכן במודעות (פיצול לפי הפסיק הראשון)
                        let parts = cleanLine.split(',');
                        let title = parts[0] ? parts[0].trim() : "";
                        let body = parts.slice(1).join(' ').replace(/^,/, '').trim();
                        
                        if (title || body) {
                            tempNews.push({ title, body });
                        }
                    }
                });

                document.getElementById('prayers-list').innerHTML = prayersHtml || "מעדכן זמנים...";
                newsItems = tempNews;

                if (newsItems.length > 0 && currentIndex === 0) showNext();
            } catch (e) {}
        }

        function showNext() {
            if (newsItems.length > 0) {
                const headerEl = document.getElementById('msg-header');
                const bodyEl = document.getElementById('msg-body');
                
                bodyEl.style.opacity = 0;
                headerEl.style.opacity = 0;

                setTimeout(() => {
                    const item = newsItems[currentIndex];
                    headerEl.textContent = item.title;
                    bodyEl.textContent = item.body;
                    
                    bodyEl.style.fontSize = item.body.length > 40 ? "3.2rem" : "5.5rem";
                    
                    bodyEl.style.opacity = 1;
                    headerEl.style.opacity = 1;
                    currentIndex = (currentIndex + 1) % newsItems.length;
                }, 500);
            }
        }

        loadSheets();
        setInterval(loadSheets, 60000);
        setInterval(showNext, 10000);
    </script>
</body>
</html>
