<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>לוח מודעות - תפארת עובדיה</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0c0c0c;
            color: white;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background: linear-gradient(90deg, #16222a, #3a6073);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #d4af37;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
        }

        .header-right h1 {
            margin: 0;
            font-size: 3rem;
            color: #d4af37;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }

        #clock {
            font-size: 4rem;
            font-weight: bold;
            color: #ffffff;
        }

        main {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #1b2735 0%, #090a0f 100%);
            padding: 20px;
        }

        #message-card {
            width: 85%;
            height: 60%;
            background: rgba(255, 255, 255, 0.98);
            color: #000;
            border-radius: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
            text-align: center;
            border: 5px solid #d4af37;
            padding: 35px;
            box-sizing: border-box;
        }

        #message-text {
            font-weight: bold;
            margin: 0;
            white-space: pre-wrap;
            transition: opacity 0.8s ease-in-out;
        }

        footer {
            background: #000;
            padding: 15px;
            text-align: center;
            font-size: 1.8rem;
            color: #d4af37;
            border-top: 2px solid #222;
        }

        /* וידאו נסתר למניעת שינה */
        #no-sleep-video {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0.01;
        }
    </style>
</head>
<body>

    <video id="no-sleep-video" playsinline muted loop>
        <source src="https://raw.githubusercontent.com/anars/blank-audio/master/250-milliseconds-of-silence.mp3" type="audio/mpeg">
    </video>

    <header>
        <div class="header-right">
            <h1>ישיבת תפארת עובדיה</h1>
            <div id="hebrew-date" style="font-size: 1.5rem; color: #fff; margin-top: 5px;">טוען תאריך...</div>
        </div>
        <div class="header-left">
            <div id="clock">00:00:00</div>
        </div>
    </header>

    <main>
        <div id="message-card">
            <p id="message-text">טוען הודעות...</p>
        </div>
    </main>

    <footer>
        "קבעת עיתים לתורה?" | לוח מודעות דיגיטלי
    </footer>

    <script>
        // 1. מניעת שינה אקטיבית
        const video = document.getElementById('no-sleep-video');
        document.addEventListener('click', () => { video.play(); }, { once: true });
        
        // ניסיון הפעלה אוטומטי
        window.onload = () => {
            video.play().catch(e => console.log("המערכת מחכה ללחיצה ראשונה כדי להפעיל מצב 'אל-תירדם'"));
        };

        // 2. שעון ותאריך
        function updateClock() { document.getElementById('clock').textContent = new Date().toLocaleTimeString('he-IL'); }
        setInterval(updateClock, 1000);
        updateClock();

        async function fetchHebrewDate() {
            try {
                const res = await fetch('https://www.hebcal.com/etc/hdate-he.json');
                const data = await res.json();
                document.getElementById('hebrew-date').textContent = data.hebrew;
            } catch (e) {}
        }
        fetchHebrewDate();

        // 3. מודעות מהגוגל שיטס שלך
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQsUHNKYdGwmym273eeGxigpITLd1ugZ-_095S6-QOcfvESZJQHmAZ-QTbZ55nNxtbXFsT2vMFglehg/pub?gid=0&single=true&output=csv';
        let messages = [];
        let index = 0;

        async function loadSheets() {
            try {
                const response = await fetch(csvUrl + '&cache=' + new Date().getTime());
                const data = await response.text();
                const lines = data.split('\n');
                messages = lines.slice(1)
                                .map(line => {
                                    const cols = line.split(',');
                                    return cols.reduce((a, b) => a.length > b.length ? a : b, "").replace(/"/g, '').trim();
                                })
                                .filter(m => m.length > 2);
                if (messages.length > 0 && index === 0) showNextMessage();
            } catch (e) {}
        }

        function showNextMessage() {
            if (messages.length > 0) {
                const msgElement = document.getElementById('message-text');
                msgElement.style.opacity = 0;
                
                setTimeout(() => {
                    const currentMsg = messages[index];
                    if (currentMsg.length > 60) msgElement.style.fontSize = "2.8rem";
                    else if (currentMsg.length > 30) msgElement.style.fontSize = "4rem";
                    else msgElement.style.fontSize = "5.5rem";

                    msgElement.textContent = currentMsg;
                    msgElement.style.opacity = 1;
                    index = (index + 1) % messages.length;
                }, 8000); // זמן החלפה
            }
        }

        loadSheets();
        setInterval(loadSheets, 60000);
        setInterval(showNextMessage, 9000);
    </script>
</body>
</html>
