<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>לוח מודעות - תפארת עובדיה</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;800&display=swap');
        * { box-sizing: border-box; }

        body {
            font-family: 'Assistant', sans-serif;
            /* רקע תמונה יוקרתי עם שכבת הצללה כדי שהטקסט יישאר קריא */
            background: linear-gradient(rgba(5, 10, 15, 0.85), rgba(5, 10, 15, 0.85)), 
                        url('https://images.unsplash.com/photo-1605648916361-9bc12ad6a569?q=80&w=2070&auto=format&fit=crop'); 
            background-size: cover;
            background-position: center;
            color: white; margin: 0; padding: 2vh 2vw; 
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        header {
            background: linear-gradient(145deg, rgba(30, 60, 114, 0.9), rgba(42, 82, 152, 0.9));
            padding: 0 30px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 4px solid #d4af37; border-radius: 15px 15px 0 0; height: 12vh;
        }

        .header-right h1 { margin: 0; font-size: 2.2rem; color: #d4af37; text-shadow: 2px 2px 8px rgba(0,0,0,0.5); }
        #clock { font-size: 3.5rem; font-weight: 800; color: #fff; }

        main { flex-grow: 1; display: flex; gap: 15px; padding: 15px 0; height: 75vh; }

        .column { display: flex; flex-direction: column; gap: 15px; height: 100%; }
        #col-right { width: 22%; } 
        #col-center { width: 56%; } 
        #col-left { width: 22%; } 

        .section-box { 
            background: rgba(255, 255, 255, 0.05); 
            border: 2px solid rgba(212, 175, 55, 0.4); 
            border-radius: 12px; padding: 10px;
            backdrop-filter: blur(5px);
        }

        .sidebar-title { 
            font-size: 1.4rem; color: #d4af37; text-align: center; 
            margin-bottom: 8px; border-bottom: 2px solid #d4af37; font-weight: 800;
        }

        .prayer-item { 
            font-size: 1.3rem; padding: 8px; background: rgba(255, 255, 255, 0.1); 
            border-radius: 6px; text-align: center; border-right: 4px solid #d4af37; margin-bottom: 5px;
            font-weight: 600;
        }

        .zman-grid { display: grid; grid-template-columns: 1fr; gap: 5px; }
        .zman-item { background: rgba(0,0,0,0.5); padding: 8px; border-radius: 6px; display: flex; justify-content: space-between; border: 1px solid rgba(212,175,55,0.3); }
        .zman-label { color: #d4af37; font-size: 1rem; }
        .zman-value { font-weight: 700; font-size: 1.2rem; }

        #message-card {
            background: rgba(255, 255, 255, 0.95); color: #050a0f; border-radius: 20px;
            display: flex; flex-direction: column; padding: 30px; text-align: center;
            border: 6px solid #d4af37; justify-content: center; height: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #msg-header { font-size: 2.8rem; color: #1e3c72; margin-bottom: 15px; font-weight: 800; border-bottom: 3px solid #d4af37; display: inline-block; }
        #msg-body { font-weight: 600; line-height: 1.3; font-size: 3.2rem; }

        .patron-box {
            flex: 1; background: rgba(212, 175, 55, 0.15);
            border: 2px solid #d4af37; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 10px; backdrop-filter: blur(5px);
        }
        .patron-title { color: #d4af37; font-size: 1.3rem; font-weight: 800; text-decoration: underline; margin-bottom: 5px; }
        .patron-name { color: #fff; font-size: 1.6rem; font-weight: 600; text-shadow: 1px 1px 3px black; }

        footer { 
            height: 10vh; /* הגדלתי את גובה הפוטר */
            text-align: center; 
            color: #d4af37; 
            font-size: 1.8rem; /* פונט גדול בהרבה */
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: 800;
            text-shadow: 2px 2px 10px black;
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-right">
            <h1>ישיבת תפארת עובדיה</h1>
            <div id="date-display">טוען...</div>
        </div>
        <div id="clock">00:00</div>
    </header>

    <main>
        <div id="col-right" class="column">
            <div id="community-section" class="section-box" style="flex-grow: 1;">
                <div class="sidebar-title">זמני הישיבה</div>
                <div id="prayers-list"></div>
            </div>
            <div class="section-box">
                <div id="zmanim-list" class="zman-grid"></div>
            </div>
        </div>

        <div id="col-center" class="column">
            <div id="message-card">
                <div><span id="msg-header"></span></div>
                <div id="msg-body">טוען הודעות...</div>
            </div>
        </div>

        <div id="col-left" class="column">
            <div class="patron-box">
                <div class="patron-title">פרנס היום</div>
                <div id="patron-day" class="patron-name">נדבת לב</div>
            </div>
            <div class="patron-box">
                <div class="patron-title">פרנס השבוע</div>
                <div id="patron-week" class="patron-name">נדבת לב</div>
            </div>
            <div class="patron-box">
                <div class="patron-title">פרנס החודש</div>
                <div id="patron-month" class="patron-name">נדבת לב</div>
            </div>
        </div>
    </main>

    <footer>נתרם לעילוי נשמת עליזה בת אריאלה ע"ה</footer>

    <script>
        // פונקציות ה-JavaScript נשארות זהות לגרסה הקודמת
        function updateDateTime() { 
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'}); 
            document.getElementById('date-display').textContent = now.toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long' });
        }
        setInterval(updateDateTime, 1000); updateDateTime();

        async function loadZmanim() {
            try {
                const response = await fetch('https://www.hebcal.com/zmanim?cfg=json&city=IL-Bnei+Brak');
                const data = await response.json();
                const t = data.times;
                document.getElementById('zmanim-list').innerHTML = `
                    <div class="zman-item"><span class="zman-label">נץ</span><span class="zman-value">${formatT(t.sunrise)}</span></div>
                    <div class="zman-item"><span class="zman-label">חצות</span><span class="zman-value">${formatT(t.chatzot)}</span></div>
                    <div class="zman-item"><span class="zman-label">שקיעה</span><span class="zman-value">${formatT(t.sunset)}</span></div>
                `;
            } catch (e) { }
        }
        function formatT(iso) { return new Date(iso).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }); }

        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQsUHNKYdGwmym273eeGxigpITLd1ugZ-_095S6-QOcfvESZJQHmAZ-QTbZ55nNxtbXFsT2vMFglehg/pub?gid=0&single=true&output=csv';
        let newsItems = [];
        let currentIndex = 0;

        function parseCSV(text) {
            let lines = text.split(/\r?\n/);
            return lines.map(line => {
                let result = [];
                let current = "";
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    let char = line[i];
                    if (char === '"' && line[i+1] === '"') { current += '"'; i++; }
                    else if (char === '"') { inQuotes = !inQuotes; }
                    else if (char === ',' && !inQuotes) { result.push(current); current = ""; }
                    else { current += char; }
                }
                result.push(current);
                return result;
            });
        }

        async function loadSheets() {
            try {
                const response = await fetch(csvUrl + '&cache=' + new Date().getTime());
                const data = await response.text();
                const rows = parseCSV(data);
                
                let prayersHtml = "";
                let tempNews = [];
                let patrons = { day: "נדבת לב", week: "נדבת לב", month: "נדבת לב" };

                rows.forEach((row, index) => {
                    if (index === 0 || row.length < 1) return;
                    let colA = (row[0] || "").trim();
                    let colB = (row[1] || "").trim();
                    
                    if (colA.includes("שחרית") || colA.includes("מנחה") || colA.includes("ערבית")) {
                        prayersHtml += `<div class="prayer-item">${colA} ${colB}</div>`;
                    } else if (colA.includes("פרנס היום")) { patrons.day = colB; }
                    else if (colA.includes("פרנס השבוע")) { patrons.week = colB; }
                    else if (colA.includes("פרנס החודש")) { patrons.month = colB; }
                    else if (colA || colB) {
                        tempNews.push({ title: colA, body: colB });
                    }
                });

                document.getElementById('prayers-list').innerHTML = prayersHtml;
                document.getElementById('patron-day').textContent = patrons.day;
                document.getElementById('patron-week').textContent = patrons.week;
                document.getElementById('patron-month').textContent = patrons.month;
                
                newsItems = tempNews;
                if (newsItems.length > 0 && currentIndex === 0) showNext();
            } catch (e) { }
        }

        function showNext() {
            if (newsItems.length === 0) return;
            const h = document.getElementById('msg-header');
            const b = document.getElementById('msg-body');
            b.style.opacity = 0;
            setTimeout(() => {
                const item = newsItems[currentIndex];
                h.textContent = item.title;
                b.textContent = item.body;
                let len = item.body.length;
                if (len < 30) b.style.fontSize = "4.5rem";
                else if (len < 100) b.style.fontSize = "3rem";
                else b.style.fontSize = "1.8rem";
                b.style.opacity = 1;
                currentIndex = (currentIndex + 1) % newsItems.length;
            }, 500);
        }

        loadZmanim(); loadSheets();
        setInterval(loadZmanim, 3600000);
        setInterval(loadSheets, 60000);
        setInterval(showNext, 12000);
    </script>
</body>
</html>
