<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ישיבת תפארת עובדיה - לוח מודעות</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@hebcal/core@latest/dist/bundle.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&family=Frank+Ruhl+Libre:wght@700&display=swap');

        body {
            margin: 0; padding: 0;
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
            color: white; direction: rtl;
            font-family: 'Assistant', sans-serif;
            overflow: hidden;
            border: 15px solid #d4af37;
            box-sizing: border-box;
            height: 100vh;
        }

        /* שעון ותאריכים */
        #topCornerInfo {
            position: absolute;
            top: 40px;
            left: 50px;
            text-align: left;
            z-index: 1001;
        }

        #clock { 
            font-size: 85px; 
            font-weight: bold; 
            color: #fff; 
            line-height: 1;
            font-family: monospace;
        }

        .date-line { 
            font-size: 26px; 
            color: #ffd700; 
            font-weight: bold;
            display: block;
            margin-top: 5px;
        }

        /* כותרת הישיבה */
        #mainHeader {
            text-align: center;
            padding: 35px 0;
            border-bottom: 3px double #d4af37;
            background: rgba(0, 0, 0, 0.5);
        }

        #mainHeader h2 {
            margin: 0;
            font-family: 'Frank Ruhl Libre', serif;
            font-size: 80px;
            color: #ffd700;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }

        /* אזור המודעות */
        #slidesContainer {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 250px);
            padding: 0 80px;
            text-align: center;
            position: relative;
        }

        .slide {
            position: absolute;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            width: 100%;
        }

        .slide.active {
            opacity: 1;
        }

        .slide h1 { 
            font-size: 110px; 
            margin-bottom: 25px; 
            font-family: 'Frank Ruhl Libre', serif;
            border-bottom: 4px solid;
            display: inline-block;
            padding-bottom: 10px;
        }

        .slide p { 
            font-size: 65px; 
            line-height: 1.4;
            max-width: 1100px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

<div id="topCornerInfo">
    <div id="clock">00:00</div>
    <div id="hebrewDate" class="date-line">טוען תאריך עברי...</div>
    <div id="englishDate" class="date-line">00/00/0000</div>
</div>

<div id="mainHeader">
    <h2>ישיבת תפארת עובדיה</h2>
</div>

<div id="slidesContainer">
    <div class="slide active">
        <h1>ברוכים הבאים</h1>
        <p>טוען נתונים מהשרת...</p>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

<script>
    // 1. עדכון שעון ותאריכים
    function updateDateTime() {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString('he-IL', {hour: '2-digit', minute: '2-digit', hour12: false});
        document.getElementById('englishDate').innerText = now.toLocaleDateString('he-IL', {day: '2-digit', month: '2-digit', year: 'numeric'});

        try {
            const hDate = new window.hebcal.HDate(now);
            document.getElementById('hebrewDate').innerText = hDate.renderGematriya();
        } catch (e) { console.error(e); }
    }
    setInterval(updateDateTime, 1000);
    updateDateTime();

    // 2. משיכת נתונים מהאקסל
    const raw_url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQsUHNKYdGwmym273eeGxigpITLd1ugZ-_095S6-QOcfvESZJQHmAZ-QTbZ55nNxtbXFsT2vMFglehg/pub?gid=0&single=true&output=csv";
    const CSV_URL = "https://api.allorigins.win/raw?url=" + encodeURIComponent(raw_url);

    let slidesData = [];
    let currentIdx = 0;

    function loadExcel() {
        Papa.parse(CSV_URL, {
            download: true,
            complete: function(results) {
                const data = results.data.slice(1).filter(r => r[0] || r[1]);
                if (data.length > 0) {
                    slidesData = data;
                    renderSlides();
                }
            }
        });
    }

    function renderSlides() {
        const container = document.getElementById("slidesContainer");
        container.innerHTML = "";
        
        slidesData.forEach((row, i) => {
            const div = document.createElement("div");
            div.className = (i === 0) ? "slide active" : "slide";
            
            // צבע מהאקסל (עמודה C) - ברירת מחדל לבן
            const customColor = row[2] ? row[2].trim() : "white";
            
            div.innerHTML = `
                <h1 style="color: ${customColor}; border-bottom-color: ${customColor};">
                    ${row[0] || ""}
                </h1>
                <p style="color: ${customColor};">
                    ${row[1] || ""}
                </p>
            `;
            container.appendChild(div);
        });
        currentIdx = 0;
    }

    function rotateSlides() {
        const slides = document.querySelectorAll(".slide");
        if (slides.length <= 1) return;
        slides[currentIdx].classList.remove("active");
        currentIdx = (currentIdx + 1) % slides.length;
        slides[currentIdx].classList.add("active");
    }

    loadExcel();
    setInterval(rotateSlides, 10000); // מעבר כל 10 שניות
    setInterval(loadExcel, 300000);   // רענון אקסל כל 5 דקות
</script>
</body>
</html>
