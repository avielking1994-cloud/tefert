<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>לוח מודעות - תפארת עובדיה</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0c0c0c;
            color: white;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background: linear-gradient(90deg, #16222a, #3a6073);
            padding: 25px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #d4af37;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
        }

        .header-right h1 {
            margin: 0;
            font-size: 3.5rem;
            color: #d4af37;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }

        #clock {
            font-size: 4.5rem;
            font-weight: bold;
            color: #ffffff;
            line-height: 1;
        }

        main {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #1b2735 0%, #090a0f 100%);
            padding: 30px;
        }

        #message-card {
            width: 80%;
            height: 55%;
            background: rgba(255, 255, 255, 0.98);
            color: #000;
            border-radius: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
            text-align: center;
            border: 5px solid #d4af37;
        }

        #message-text {
            font-size: 5rem;
            font-weight: bold;
            margin: 0;
            padding: 20px;
            white-space: pre-wrap; /* שומר על ירידת שורות אם יש */
        }

        footer {
            background: #000;
            padding: 20px;
            text-align: center;
            font-size: 2rem;
            color: #d4af37;
            border-top: 2px solid #222;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-right">
            <h1>ישיבת תפארת עובדיה</h1>
            <div id="hebrew-date" style="font-size: 1.5rem; color: #fff; margin-top: 10px;">טוען תאריך...</div>
        </div>
        <div class="header-left">
            <div id="clock">00:00:00</div>
        </div>
    </header>

    <main>
        <div id="message-card">
            <p id="message-text">טוען הודעות מהמערכת...</p>
        </div>
    </main>

    <footer>
        "קבעת עיתים לתורה?" | לוח מודעות דיגיטלי
    </footer>

    <script>
        // 1. שעון
        function updateClock() {
            document.getElementById('clock').textContent = new Date().toLocaleTimeString('he-IL');
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. תאריך עברי
        async function fetchHebrewDate() {
            try {
                const res = await fetch('https://www.hebcal.com/etc/hdate-he.json');
                const data = await res.json();
                document.getElementById('hebrew-date').textContent = data.hebrew;
            } catch (e) { console.error("Date error"); }
        }
        fetchHebrewDate();

        // 3. משיכת הודעות מהקישור שלך
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQsUHNKYdGwmym273eeGxigpITLd1ugZ-_095S6-QOcfvESZJQHmAZ-QTbZ55nNxtbXFsT2vMFglehg/pub?gid=0&single=true&output=csv'; 
        
        let messages = [];
        let index = 0;

        async function loadSheets() {
            try {
                // מוסיפים מספר אקראי בסוף הקישור כדי למנוע מהדפדפן לשמור גרסה ישנה
                const response = await fetch(csvUrl + '&cache_buster=' + new Date().getTime());
                const data = await response.text();
                
                // מנקה שורות ריקות ומוריד גרשיים אם גוגל הוסיף
                messages = data.split('\n')
                               .map(m => m.replace(/"/g, '').trim())
                               .filter(m => m !== "");

                // אם יש שורת כותרת בטבלה, אפשר להוריד אותה (אופציונלי):
                // messages.shift(); 

                if (messages.length > 0 && index === 0) {
                    showNextMessage();
                }
            } catch (e) { 
                console.error("Sheet error", e);
                document.getElementById('message-text').textContent = "ממתין לעדכון נתונים...";
            }
        }

        function showNextMessage() {
            if (messages.length > 0) {
                const msgElement = document.getElementById('message-text');
                msgElement.textContent = messages[index];
                index = (index + 1) % messages.length;
            }
        }

        loadSheets();
        setInterval(loadSheets, 60000); // רענון מהטבלה כל דקה
        setInterval(showNextMessage, 6000); // החלפת הודעה כל 6 שניות
    </script>
</body>
</html>
