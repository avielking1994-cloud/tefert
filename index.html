<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>לוח מודעות - תפארת עובדיה</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0c0c0c;
            color: white;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background: linear-gradient(90deg, #16222a, #3a6073);
            padding: 25px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #d4af37;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
        }

        .header-right h1 {
            margin: 0;
            font-size: 3.5rem;
            color: #d4af37;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }

        #clock {
            font-size: 4.5rem;
            font-weight: bold;
            color: #ffffff;
        }

        main {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #1b2735 0%, #090a0f 100%);
        }

        #message-card {
            width: 80%;
            height: 55%;
            background: rgba(255, 255, 255, 0.98);
            color: #000;
            border-radius: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
            text-align: center;
            border: 5px solid #d4af37;
        }

        #message-text {
            font-size: 5rem;
            font-weight: bold;
            margin: 0;
        }

        footer {
            background: #000;
            padding: 20px;
            text-align: center;
            font-size: 2rem;
            color: #d4af37;
            border-top: 2px solid #222;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-right">
            <h1>ישיבת תפארת עובדיה</h1>
            <div id="hebrew-date" style="font-size: 1.5rem; color: #fff;">טוען תאריך...</div>
        </div>
        <div class="header-left">
            <div id="clock">00:00:00</div>
        </div>
    </header>

    <main>
        <div id="message-card">
            <p id="message-text">טוען הודעות...</p>
        </div>
    </main>

    <footer>
        "קבעת עיתים לתורה?" | לוח מודעות דיגיטלי
    </footer>

    <script>
        function updateClock() {
            document.getElementById('clock').textContent = new Date().toLocaleTimeString('he-IL');
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function fetchHebrewDate() {
            try {
                const res = await fetch('https://www.hebcal.com/etc/hdate-he.json');
                const data = await res.json();
                document.getElementById('hebrew-date').textContent = data.hebrew;
            } catch (e) { console.error("Date error"); }
        }
        fetchHebrewDate();

        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT16y6S3K0yH2YqKIdB6Dq9mYy_Yy3-x-O_N_p2W1W_o9x-X_Z-Z-Z/pub?output=csv'; 
        
        let messages = ["ברוכים הבאים"];
        let index = 0;

        async function loadSheets() {
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                messages = data.split('\n').map(m => m.trim()).filter(m => m !== "");
            } catch (e) { console.error("Sheet error"); }
        }

        function showNextMessage() {
            if (messages.length > 0) {
                document.getElementById('message-text').textContent = messages[index];
                index = (index + 1) % messages.length;
            }
        }

        loadSheets();
        setInterval(loadSheets, 60000);
        setInterval(showNextMessage, 5000);
    </script>
</body>
</html>
