<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ישיבת תפארת עובדיה - לוח מודעות</title>
    <script src="https://cdn.jsdelivr.net/npm/@hebcal/core@latest/dist/bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&family=Frank+Ruhl+Libre:wght@700&display=swap');

        body {
            margin: 0; padding: 0;
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
            color: white; direction: rtl;
            font-family: 'Assistant', sans-serif;
            overflow: hidden;
            border: 12px solid #d4af37;
            box-sizing: border-box;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #topCornerInfo {
            position: absolute; top: 25px; left: 30px;
            text-align: left; z-index: 1005;
        }
        #clock { font-size: 60px; font-weight: bold; font-family: monospace; }
        .date-line { color: #ffd700; font-size: 20px; font-weight: bold; display: block; }

        #mainHeader {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px double #d4af37;
            background: rgba(0, 0, 0, 0.6);
            flex-shrink: 0;
        }
        #mainHeader h2 {
            margin: 0; font-family: 'Frank Ruhl Libre', serif;
            font-size: 60px; color: #ffd700;
        }

        #mainContent {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* לוח תפילות בצד ימין */
        #sidebar {
            width: 380px;
            border-left: 2px solid #d4af37;
            background: rgba(212, 175, 55, 0.05);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .sidebar-item {
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 10px;
        }
        .sidebar-item h3 { margin: 0; font-size: 30px; }
        .sidebar-item p { margin: 5px 0 0; font-size: 45px; font-weight: bold; }

        /* מודעות מתחלפות במרכז */
        #slidesContainer {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 40px;
        }
        .slide {
            position: absolute; opacity: 0;
            transition: opacity 1.5s ease-in-out;
            width: 90%; text-align: center;
        }
        .slide.active { opacity: 1; }
        .slide h1 { font-size: 90px; font-family: 'Frank Ruhl Libre', serif; border-bottom: 4px solid; display: inline-block; margin-bottom: 20px; }
        .slide p { font-size: 55px; line-height: 1.3; }
    </style>
</head>
<body>

<div id="topCornerInfo">
    <div id="clock">00:00</div>
    <span id="hebrewDate" class="date-line">טוען...</span>
    <span id="englishDate" class="date-line"></span>
</div>

<div id="mainHeader">
    <h2>ישיבת תפארת עובדיה</h2>
</div>

<div id="mainContent">
    <div id="sidebar"></div>
    <div id="slidesContainer"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
<script>
    function updateTime() {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString('he-IL', {hour: '2-digit', minute: '2-digit', hour12: false});
        document.getElementById('englishDate').innerText = now.toLocaleDateString('he-IL', {day: '2-digit', month: '2-digit', year: 'numeric'});
        if (window.hebcal) {
            const hDate = new window.hebcal.HDate(now);
            document.getElementById('hebrewDate').innerText = hDate.renderGematriya();
        }
    }
    setInterval(updateTime, 1000); updateTime();

    const raw_url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQsUHNKYdGwmym273eeGxigpITLd1ugZ-_095S6-QOcfvESZJQHmAZ-QTbZ55nNxtbXFsT2vMFglehg/pub?gid=0&single=true&output=csv";
    const CSV_URL = "https://api.allorigins.win/raw?url=" + encodeURIComponent(raw_url);

    let slidesData = [];
    let currentIdx = 0;

    function loadExcel() {
        Papa.parse(CSV_URL, {
            download: true,
            complete: function(results) {
                const data = results.data.filter(r => r[0] || r[1]);
                if (data.length < 2) return;

                // עדכון התפילות בצד ימין (שורות 2-4)
                const sidebar = document.getElementById("sidebar");
                sidebar.innerHTML = "<h2 style='font-size:28px; color:white; border-bottom:1px solid gold; margin-bottom:15px;'>זמני תפילות</h2>";
                
                for(let i=1; i<=3; i++) {
                    if(data[i]) {
                        const color = (data[i][2] && data[i][2].trim()) ? data[i][2].trim() : "#ffd700";
                        sidebar.innerHTML += `
                            <div class="sidebar-item">
                                <h3 style="color: white;">${data[i][0]}</h3>
                                <p style="color: ${color};">${data[i][1]}</p>
                            </div>`;
                    }
                }

                // עדכון מודעות מתחלפות (משורה 5 ומטה)
                slidesData = data.slice(4);
                renderSlides();
            }
        });
    }

    function renderSlides() {
        const container = document.getElementById("slidesContainer");
        container.innerHTML = "";
        slidesData.forEach((row, i) => {
            const div = document.createElement("div");
            div.className = (i === 0) ? "slide active" : "slide";
            const color = (row[2] && row[2].trim()) ? row[2].trim() : "white";
            div.innerHTML = `
                <h1 style="color:${color}; border-bottom-color:${color}">${row[0]||""}</h1>
                <p style="color:${color}">${row[1]||""}</p>`;
            container.appendChild(div);
        });
        currentIdx = 0;
    }

    function rotate() {
        const slides = document.querySelectorAll(".slide");
        if (slides.length <= 1) return;
        slides[currentIdx].classList.remove("active");
        currentIdx = (currentIdx + 1) % slides.length;
        slides[currentIdx].classList.add("active");
    }

    loadExcel();
    setInterval(rotate, 10000);
    setInterval(loadExcel, 300000);
</script>
</body>
</html>
