<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ישיבת תפארת עובדיה</title>
<style>
body { margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; background: #000; color: white; direction: rtl; }
#mainHeader { position: absolute; top: 0; width: 100%; text-align: center; background: linear-gradient(to bottom, rgba(0, 31, 63, 0.95), rgba(0,0,0,0)); padding: 25px 0; z-index: 1000; }
#mainHeader h2 { margin: 0; font-size: 55px; color: #ffd700; text-shadow: 2px 2px 10px rgba(0,0,0,0.9); }
#topBar { position: absolute; top: 110px; left: 30px; text-align: right; z-index: 100; background: rgba(255, 255, 255, 0.1); padding: 20px 30px; border-radius: 15px; border-right: 6px solid #ffd700; }
#clock { font-size: 65px; font-weight: bold; line-height: 1; }
#hebrewDate { font-size: 28px; color: #ffd700; margin-top: 10px; }
#parasha { font-size: 22px; color: #00d4ff; }
.slide { display: none; flex-direction: column; justify-content: center; align-items: center; width: 100vw; height: 100vh; background: radial-gradient(circle, #001f3f 0%, #000 100%); text-align: center; opacity: 0; transition: opacity 1s ease-in-out; }
.slide h1 { font-size: 70px; margin-bottom: 20px; color: #fff; }
.slide p { font-size: 45px; max-width: 80%; }
</style>
</head>
<body>

<div id="mainHeader"><h2>ישיבת תפארת עובדיה</h2></div>
<div id="topBar">
    <div id="clock">00:00:00</div>
    <div id="hebrewDate">טוען תאריך...</div>
    <div id="parasha"></div>
</div>
<div id="slidesContainer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

<script>
// שעון - פונקציה פשוטה שלא תלויה בכלום
function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    document.getElementById('clock').innerText = h + ":" + m + ":" + s;
}
setInterval(updateClock, 1000);
updateClock();

// תאריך עברי
async function getDates() {
    try {
        const res = await fetch('https://www.hebcal.com/etc/hdate-he.json');
        const data = await res.json();
        document.getElementById('hebrewDate').innerText = data.hebrew;
    } catch (e) { document.getElementById('hebrewDate').innerText = "שגיאת חיבור"; }
}
getDates();

// משיכת נתונים מגוגל - שים לב לקישור!
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQsUHNKYdGwmym273eeGxigpITLd1ugZ-_095S6-QOcfvESZJQHmAZ-QTbZ55nNxtbXFsT2vMFglehg/pub?gid=0&single=true&output=csv";

function loadMessages() {
    Papa.parse(CSV_URL, {
        download: true,
        header: false,
        complete: function(results) {
            const data = results.data.slice(1).filter(r => r[0] || r[1]);
            const container = document.getElementById("slidesContainer");
            container.innerHTML = ""; // ניקוי לפני טעינה

            data.forEach((row, i) => {
                const div = document.createElement("div");
                div.className = "slide";
                div.innerHTML = "<h1>" + (row[0] || "") + "</h1><p>" + (row[1] || "") + "</p>";
                container.appendChild(div);
            });
            startSlides();
        },
        error: function() {
            document.getElementById("slidesContainer").innerHTML = "<div class='slide' style='display:flex; opacity:1;'><h1>שגיאה בטעינת האקסל</h1><p>בדוק פרסום באינטרנט</p></div>";
        }
    });
}

let slideIndex = 0;
function startSlides() {
    const slides = document.getElementsByClassName("slide");
    if (slides.length === 0) return;
    
    function next() {
        for (let s of slides) { s.style.display = "none"; s.style.opacity = "0"; }
        slideIndex++;
        if (slideIndex > slides.length) slideIndex = 1;
        slides[slideIndex-1].style.display = "flex";
        setTimeout(() => { slides[slideIndex-1].style.opacity = "1"; }, 100);
    }
    next();
    setInterval(next, 8000);
}

loadMessages();
</script>
</body>
</html>
