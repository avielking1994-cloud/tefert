<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>לוח מודעות - תפארת עובדיה</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0c0c0c;
            color: white;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background: linear-gradient(90deg, #16222a, #3a6073);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #d4af37;
        }

        .header-right h1 { margin: 0; font-size: 2.5rem; color: #d4af37; }
        #clock { font-size: 3rem; font-weight: bold; }

        main {
            flex-grow: 1;
            display: flex;
            gap: 20px;
            padding: 20px;
            background: radial-gradient(circle, #1b2735 0%, #090a0f 100%);
            box-sizing: border-box;
        }

        /* מלבן זמני תפילה (ימין) */
        #prayers-sidebar {
            width: 35%;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid #d4af37;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .sidebar-title {
            font-size: 2.2rem;
            color: #d4af37;
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #d4af37;
            padding-bottom: 10px;
        }

        .prayer-item {
            font-size: 2rem;
            margin-bottom: 20px;
            padding: 10px;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 10px;
            text-align: center;
        }

        /* מלבן מודעות מתחלפות (שמאל) */
        #message-card {
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.98);
            color: #000;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
            border: 4px solid #d4af37;
        }

        #msg-body { font-weight: bold; transition: opacity 0.5s ease; }

        footer { background: #000; padding: 10px; text-align: center; color: #d4af37; font-size: 1.2rem; }
    </style>
</head>
<body>

    <header>
        <div class="header-right">
            <h1>ישיבת תפארת עובדיה</h1>
            <div id="hebrew-date" style="font-size: 1.3rem; color: #fff;">טוען תאריך...</div>
        </div>
        <div id="clock">00:00:00</div>
    </header>

    <main>
        <div id="prayers-sidebar">
            <div class="sidebar-title">זמני תפילה</div>
            <div id="prayers-list"></div>
        </div>
        <div id="message-card">
            <p id="msg-body">טוען הודעות...</p>
        </div>
    </main>

    <footer>"והגית בו יומם ולילה"</footer>

    <script>
        function updateClock() { document.getElementById('clock').textContent = new Date().toLocaleTimeString('he-IL'); }
        setInterval(updateClock, 1000); updateClock();

        async function fetchHebrewDate() {
            try {
                const res = await fetch('https://www.hebcal.com/etc/hdate-he.json');
                const data = await res.json();
                document.getElementById('hebrew-date').textContent = data.hebrew;
            } catch (e) {}
        }
        fetchHebrewDate();

        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQsUHNKYdGwmym273eeGxigpITLd1ugZ-_095S6-QOcfvESZJQHmAZ-QTbZ55nNxtbXFsT2vMFglehg/pub?gid=0&single=true&output=csv';
        
        let newsItems = [];
        let currentIndex = 0;

        async function loadSheets() {
            try {
                const response = await fetch(csvUrl + '&cache=' + new Date().getTime());
                const data = await response.text();
                
                // פירוק לפי שורות
                const lines = data.split('\n').map(l => l.replace(/"/g, '').trim()).filter(l => l.length > 2);
                
                let prayersHtml = "";
                let tempNews = [];

                lines.forEach(line => {
                    // אם השורה מכילה מילות מפתח של תפילה, נשים אותה בימין
                    if (line.includes("שחרית") || line.includes("מנחה") || line.includes("ערבית")) {
                        prayersHtml += `<div class="prayer-item">${line}</div>`;
                    } 
                    // אחרת, אם זו לא הכותרת של הטבלה, נשים בשמאל
                    else if (!line.includes("TitleText") && !line.includes("זמני תפילה")) {
                        tempNews.push(line);
                    }
                });

                document.getElementById('prayers-list').innerHTML = prayersHtml || "מעדכן זמנים...";
                newsItems = tempNews;

                if (newsItems.length > 0 && currentIndex === 0) showNext();
            } catch (e) {}
        }

        function showNext() {
            if (newsItems.length > 0) {
                const bodyEl = document.getElementById('msg-body');
                bodyEl.style.opacity = 0;
                setTimeout(() => {
                    bodyEl.textContent = newsItems[currentIndex];
                    bodyEl.style.fontSize = newsItems[currentIndex].length > 40 ? "3.2rem" : "5.5rem";
                    bodyEl.style.opacity = 1;
                    currentIndex = (currentIndex + 1) % newsItems.length;
                }, 500);
            }
        }

        loadSheets();
        setInterval(loadSheets, 60000);
        setInterval(showNext, 10000);
    </script>
</body>
</html>
