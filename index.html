<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>לוח מודעות - תפארת עובדיה</title>
    <script src="https://cdn.jsdelivr.net/npm/@hebcal/core@latest/dist/bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;800&display=swap');
        
        * { box-sizing: border-box; }

        body {
            font-family: 'Assistant', sans-serif;
            background: linear-gradient(rgba(0, 15, 35, 0.8), rgba(0, 15, 35, 0.8)), 
                        url('http://googleusercontent.com/image_collection/image_retrieval/1711381228697292235_0');
            background-size: cover; background-position: center;
            color: white; margin: 0; height: 100vh; width: 100vw;
            display: flex; flex-direction: column; overflow: hidden;
            border: 12px solid #d4af37; padding: 10px;
        }

        header {
            height: 15%; background: rgba(16, 33, 61, 0.9); padding: 0 30px; 
            display: flex; justify-content: space-between; align-items: center;
            border: 2px solid #d4af37; border-radius: 15px; margin-bottom: 10px;
        }

        .header-right h1 { margin: 0; font-size: 2.2rem; color: #d4af37; font-weight: 800; }
        #date-display { font-size: 1.3rem; color: #ddd; }
        #clock { font-size: 3.5rem; font-weight: 800; }

        main { height: 70%; display: flex; gap: 15px; padding-bottom: 10px; }
        .column { display: flex; flex-direction: column; gap: 10px; height: 100%; }
        #col-right { width: 23%; } #col-center { width: 54%; } #col-left { width: 23%; } 

        .section-box { 
            background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(212, 175, 55, 0.5); 
            border-radius: 12px; padding: 10px; overflow: hidden; display: flex; flex-direction: column;
        }

        .sidebar-title { 
            font-size: 1.3rem; color: #d4af37; text-align: center; 
            margin-bottom: 5px; border-bottom: 2px solid #d4af37; font-weight: 800;
        }

        #prayers-list { overflow: hidden; flex-grow: 1; }
        .prayer-item { 
            font-size: 1.2rem; padding: 6px; background: rgba(212, 175, 55, 0.1); 
            border-radius: 6px; text-align: center; border-right: 4px solid #d4af37; margin-bottom: 5px;
        }

        #message-card {
            background: rgba(255, 255, 255, 0.96); color: #050a0f; border-radius: 20px;
            display: flex; flex-direction: column; padding: 20px; text-align: center;
            border: 6px solid #d4af37; justify-content: center; height: 100%;
        }
        /* צבע כותרת המודעה המקורי */
        #msg-header { font-size: 2.5rem; color: #1e3c72; font-weight: 800; margin-bottom: 10px; }
        #msg-body { font-weight: 800; font-size: 3rem; line-height: 1.2; }

        .patron-box {
            flex: 1; background: rgba(212, 175, 55, 0.15); border: 2px solid #d4af37; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 5px; text-align: center;
        }
        .patron-title { color: #d4af37; font-size: 1.1rem; font-weight: 800; text-decoration: underline; }
        .patron-name { color: #fff; font-size: 1.4rem; font-weight: 600; }

        footer { 
            height: 10%; background: rgba(0,0,0,0.4); border-radius: 10px;
            text-align: center; color: #d4af37; font-size: 2rem; display: flex; 
            align-items: center; justify-content: center; font-weight: 800; border-top: 1px solid #d4af37;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-right">
            <h1>ישיבת תפארת עובדיה</h1>
            <div id="date-display">טוען...</div>
        </div>
        <div id="clock">00:00</div>
    </header>

    <main>
        <div id="col-right" class="column">
            <div class="section-box" style="height: 100%;">
                <div class="sidebar-title">זמני הישיבה</div>
                <div id="prayers-list"></div>
            </div>
        </div>

        <div id="col-center" class="column">
            <div id="message-card">
                <div><span id="msg-header"></span></div>
                <div id="msg-body">טוען...</div>
            </div>
        </div>

        <div id="col-left" class="column">
            <div class="patron-box"><div class="patron-title">פרנס היום</div><div id="patron-day" class="patron-name"></div></div>
            <div class="patron-box" style="margin: 5px 0;"><div class="patron-title">פרנס השבוע</div><div id="patron-week" class="patron-name"></div></div>
            <div class="patron-box"><div class="patron-title">פרנס החודש</div><div id="patron-month" class="patron-name"></div></div>
        </div>
    </main>

    <footer>נתרם לעילוי נשמת עליזה בת אריאלה ע"ה</footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script>
        function updateDateTime() { 
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'}); 
            let dateStr = now.toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long' });
            if (window.hebcal) {
                const hDate = new window.hebcal.HDate(now);
                dateStr += " | " + hDate.renderGematriya();
            }
            document.getElementById('date-display').textContent = dateStr;
        }
        setInterval(updateDateTime, 1000); updateDateTime();

        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQsUHNKYdGwmym273eeGxigpITLd1ugZ-_095S6-QOcfvESZJQHmAZ-QTbZ55nNxtbXFsT2vMFglehg/pub?gid=0&single=true&output=csv';
        let newsItems = []; let currentIndex = 0;

        function loadSheets() {
            Papa.parse(csvUrl, {
                download: true,
                complete: function(results) {
                    const rows = results.data;
                    let prayersHtml = ""; let tempNews = [];
                    let patrons = { day: "נדבת לב", week: "נדבת לב", month: "נדבת לב" };
                    
                    rows.forEach((row, index) => {
                        if (index === 0) return;
                        let colA = String(row[0] || "").trim();
                        let colB = String(row[1] || "").trim();
                        let colC = String(row[2] || "").replace(/[^a-zA-Z]/g, "").toLowerCase();

                        if (colA.includes("שחרית") || colA.includes("מנחה") || colA.includes("ערבית")) {
                            prayersHtml += `<div class="prayer-item">${colA} ${colB}</div>`;
                        } else if (colA.includes("פרנס היום")) { patrons.day = colB; }
                        else if (colA.includes("פרנס השבוע")) { patrons.week = colB; }
                        else if (colA.includes("פרנס החודש")) { patrons.month = colB; }
                        else if (colA !== "" || colB !== "") { 
                            tempNews.push({ title: colA, body: colB, color: colC }); 
                        }
                    });

                    document.getElementById('prayers-list').innerHTML = prayersHtml;
                    document.getElementById('patron-day').textContent = patrons.day;
                    document.getElementById('patron-week').textContent = patrons.week;
                    document.getElementById('patron-month').textContent = patrons.month;
                    newsItems = tempNews;
                    if (newsItems.length > 0) showNext();
                }
            });
        }

        function showNext() {
            if (newsItems.length === 0) return;
            const h = document.getElementById('msg-header');
            const b = document.getElementById('msg-body');
            const item = newsItems[currentIndex];
            
            h.textContent = item.title; 
            b.textContent = item.body;
            
            // הכותרת תמיד נשארת בצבע המקורי
            h.style.color = "#1e3c72";

            // רק גוף המודעה משתנה לפי הצבע מהאקסל
            if (item.color && item.color.length > 2) {
                b.style.setProperty('color', item.color, 'important');
            } else {
                b.style.color = "#050a0f"; // ברירת מחדל שחור
            }

            currentIndex = (currentIndex + 1) % newsItems.length;
        }

        loadSheets();
        setInterval(loadSheets, 30000); 
        setInterval(showNext, 12000);
    </script>
</body>
</html>
